name: Daily Batch (5 videos)

on:
  # Runs once a day at 00:00 UTC. The orchestrator computes per-slot publishAt
  # so each video goes live at its niche's scheduled time (04:00, 09:00, 13:00, 17:00, 21:00 UTC).
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Optional: run only one slot id (did_you_know|tech_news|ai_breakthrough|cybersecurity|viral_science). Empty = all 5."
        required: false
        default: ""
      no_upload:
        description: "Build but skip YouTube upload"
        required: false
        default: "false"
      skip_svd:
        description: "Skip SVD animation (faster, Ken Burns only)"
        required: false
        default: "false"

# Prevent two daily runs from clobbering the ledger
concurrency:
  group: utube-daily
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # commit ledger.json + run artifacts back to repo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build matrix args
        id: args
        run: |
          ARGS=""
          if [ -n "${{ inputs.slot }}" ]; then ARGS="$ARGS --slot ${{ inputs.slot }}"; fi
          if [ "${{ inputs.no_upload }}" = "true" ]; then ARGS="$ARGS --no-upload"; fi
          if [ "${{ inputs.skip_svd }}" = "true" ]; then ARGS="$ARGS --skip-svd"; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run orchestrator
        env:
          # LLM providers (set whichever you have)
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          # Stock media
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # YouTube upload
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m pipeline.orchestrator ${{ steps.args.outputs.args }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            runs/**/*.json
            runs/**/captions.srt
            runs/**/thumbnail.jpg
          retention-days: 14
          if-no-files-found: warn

      - name: Commit ledger + run summaries
        if: always()
        run: |
          git config user.name  "utube-bot"
          git config user.email "utube-bot@users.noreply.github.com"
          git add ledger.json runs/**/*.json runs/**/captions.srt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(run): batch summary $(date -u +%Y-%m-%d)"
            git push origin HEAD:${{ github.ref_name }} || true
          else
            echo "Nothing to commit."
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Daily batch failed (${today})`,
              body:  `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["daily-batch-failure"],
            });
