name: Daily Random Uploads

# Two random windows per day (IST), 1 or 2 videos each.
#
#   Window 1 cron:  23:30 UTC  =>  05:00 IST   (random sleep 0-59min => fires anywhere in 05:00-06:00 IST)
#   Window 2 cron:  00:30 UTC  =>  06:00 IST   (random sleep 0-59min => fires anywhere in 06:00-07:00 IST)
#
# Per-window video count (1 or 2) is chosen by the orchestrator from
# config/schedule.yaml > videos_min / videos_max.

on:
  schedule:
    - cron: "30 23 * * *"   # 05:00 IST window starts
  workflow_dispatch:
    inputs:
      videos_min:
        description: "Min videos this run (overrides schedule.yaml)"
        required: false
        default: "1"
      videos_max:
        description: "Max videos this run (overrides schedule.yaml)"
        required: false
        default: "1"
      lane:
        description: "Optional: restrict random pick to this lane id"
        required: false
        default: ""
      no_upload:
        description: "Build but skip YouTube upload"
        required: false
        default: "false"
      skip_svd:
        description: "Skip SVD animation (faster build)"
        required: false
        default: "false"
      skip_random_sleep:
        description: "Skip the 0-59 min random delay (manual runs)"
        required: false
        default: "true"

# Each window gets its own concurrency lane so they don't cancel each other,
# but two of the same window can't double-fire.
concurrency:
  group: utube-random-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.chance.outputs.run }}
    steps:
      - name: 50% chance to run
        id: chance
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ $((RANDOM % 2)) -eq 0 ]; then
              echo "Skipping this run (50% chance)."
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "Running this time (50% chance)."
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Manual run, always running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  produce:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # commit ledger.json + run artifacts back to repo
      issues:   write   # auto-open an issue when the run fails (see last step)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Random delay within the hour
        if: github.event_name == 'schedule' || inputs.skip_random_sleep != 'true'
        run: |
          DELAY=$((RANDOM % 3600))
          echo "Sleeping ${DELAY}s to randomize publish time within the window."
          sleep "$DELAY"

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt

      - name: Build args
        id: args
        env:
          VIDEOS_MIN: ${{ inputs.videos_min || '1' }}
          VIDEOS_MAX: ${{ inputs.videos_max || '2' }}
          LANE:       ${{ inputs.lane || '' }}
          NO_UPLOAD:  ${{ inputs.no_upload || 'false' }}
          SKIP_SVD:   ${{ inputs.skip_svd || 'false' }}
        run: |
          ARGS="--random-batch --videos-min $VIDEOS_MIN --videos-max $VIDEOS_MAX"
          if [ -n "$LANE" ];        then ARGS="$ARGS --lane $LANE"; fi
          if [ "$NO_UPLOAD" = "true" ]; then ARGS="$ARGS --no-upload"; fi
          if [ "$SKIP_SVD" = "true" ];  then ARGS="$ARGS --skip-svd"; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run orchestrator
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CAMB_API_KEY:       ${{ secrets.CAMB_API_KEY }}
          ELEVENLABS_API_KEY_1: ${{ secrets.ELEVENLABS_API_KEY_1 }}
          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:    ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m pipeline.orchestrator ${{ steps.args.outputs.args }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            runs/**/*.json
            runs/**/captions.srt
            runs/**/thumbnail.jpg
          retention-days: 14
          if-no-files-found: warn

      - name: Commit ledger + run summaries
        if: always()
        run: |
          git config user.name  "utube-bot"
          git config user.email "utube-bot@users.noreply.github.com"
          git add ledger.json runs/**/*.json runs/**/captions.srt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(run): random batch $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:${{ github.ref_name }} || true
          else
            echo "Nothing to commit."
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Daily random run failed (${today})`,
              body:  `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["daily-batch-failure"],
            });