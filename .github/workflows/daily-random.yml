name: Daily Random Uploads

# Production scheduler. The default/production branch is `main`.
# The workflow runs the application code checked out from the same ref that triggered it.

on:
  schedule:
    # Weekdays: 7:00 AM India Standard Time (Asia/Kolkata)
    - cron: "0 7 * * 1,2,3,5"
      timezone: "Asia/Kolkata"
    # Saturday + Sunday: 12:30 PM India Standard Time (Asia/Kolkata)
    - cron: "30 12 * * 0,6"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      no_upload:
        description: "Build but skip YouTube upload"
        required: false
        default: "false"
      skip_svd:
        description: "Skip SVD animation (faster build)"
        required: false
        default: "false"
      script_only:
        description: "Stop immediately after generating script (no media)"
        required: false
        default: "false"

concurrency:
  group: utube-daily
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    # F5-TTS on CPU is the dominant cost and has recently taken ~18 minutes
    # for a ~40s narration. Giving it the absolute maximum time allowed by
    # GitHub Actions (360 minutes / 6 hours) to prevent any premature kills.
    timeout-minutes: 360
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Cache F5-TTS model weights
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: f5tts-v1-base-${{ runner.os }}
          restore-keys: f5tts-v1-base-
      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system "numpy<2" torch torchvision torchaudio torchcodec --index-url https://download.pytorch.org/whl/cpu
      - name: Install Python deps
        run: uv pip install --system -r requirements.txt
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Puter.js
        run: npm install @heyputer/puter.js
      - name: Produce and upload videos
        env:
          BRAVE_API_KEY_SEARCH: ${{ secrets.BRAVE_API_KEY_SEARCH }}
          BRAVE_API_KEY_ANSWERS: ${{ secrets.BRAVE_API_KEY_ANSWERS }}
          BRAVE_API_KEY_SPELLCHECK: ${{ secrets.BRAVE_API_KEY_SPELLCHECK }}
          BRAVE_API_KEY_AUTOSUGGEST: ${{ secrets.BRAVE_API_KEY_AUTOSUGGEST }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLMSRELAY_API_KEY: ${{ secrets.LLMSRELAY_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          F5_REF_AUDIO: assets/voice_ref.wav
          F5_REF_TEXT: ${{ secrets.F5_REF_TEXT }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NO_UPLOAD="${{ inputs.no_upload || 'false' }}"
          SKIP_SVD="${{ inputs.skip_svd || 'false' }}"
          SCRIPT_ONLY="${{ inputs.script_only || 'false' }}"
          BASE=""
          # Branch guard: only allow uploads from the production branch (main)
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::warning::Non-main branch detected — forcing --no-upload"
            BASE="$BASE --no-upload"
          fi
          [ "$NO_UPLOAD" = "true" ] && BASE="$BASE --no-upload"
          [ "$SKIP_SVD" = "true" ] && BASE="$BASE --skip-svd"
          [ "$SCRIPT_ONLY" = "true" ] && BASE="$BASE --script-only"
          python -m pipeline.orchestrator $BASE
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: run-${{ github.run_id }}
          path: |
            runs/**/*.json
            runs/**/captions.ass
            runs/**/thumbnail.jpg
          retention-days: 14
          if-no-files-found: warn
      - name: Commit ledger + run summaries
        if: always()
        run: |
          set -euo pipefail
          git config user.name "utube-bot"
          git config user.email "utube-bot@users.noreply.github.com"
          git add ledger.json
          if [ -d runs ]; then
            git add runs/
          fi
          if [ -d data ]; then
            git add data/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(run): daily batch $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Nothing to commit."
          fi
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily run failed (${today})`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["daily-batch-failure"],
            });
