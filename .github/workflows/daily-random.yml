name: Daily Random Uploads

# Scheduled workflows execute from the default branch. During the controlled
# evaluation window 2026-08-30 through 2026-09-05, this scheduler explicitly
# checks out and runs the `improved` branch, then automatically returns to the
# normal `main` code path on 2026-09-06.
#
# IMPORTANT: the scheduled job below is the scheduler, but the application code
# being executed during the test window is from `improved`.

on:
  schedule:
    - cron: "30 12 * * 1-3,5"
    - cron: "30 4 * * 6"
    - cron: "30 3 * * 0"
    - cron: "0 12 * * 0,6"
  workflow_dispatch:
    inputs:
      video_count:
        description: "Videos to produce (0-2). Leave empty for random."
        required: false
        default: ""
      lane:
        description: "Optional: restrict random pick to this lane id"
        required: false
        default: ""
      no_upload:
        description: "Build but skip YouTube upload"
        required: false
        default: "false"
      skip_svd:
        description: "Skip SVD animation (faster build)"
        required: false
        default: "false"
      skip_random_sleep:
        description: "Skip random delays between videos (manual runs)"
        required: false
        default: "true"

concurrency:
  group: utube-daily
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    permissions:
      contents: write
      issues: write
    steps:
      - name: Select code branch for one-week evaluation
        id: test_window
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"
          TEST_END="2026-09-05"
          if [[ "$TODAY" < "2026-08-30" ]]; then
            REF="main"
            MODE="normal-pre-test"
          elif [[ "$TODAY" > "$TEST_END" ]]; then
            REF="main"
            MODE="normal-post-test"
          else
            REF="improved"
            MODE="IMPROVED-WEEK-TEST"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "TEST DATE: $TODAY"
          echo "EXECUTION MODE: $MODE"
          echo "CODE REF: $REF"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ steps.test_window.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Cache F5-TTS model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: f5tts-v1-base-${{ runner.os }}
          restore-keys: f5tts-v1-base-

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system "numpy<2" torch torchvision torchaudio torchcodec --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python deps
        run: |
          uv pip install --system -r requirements.txt

      - name: Produce and upload videos
        env:
          NVIDIA_NIM_API_KEY:    ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENROUTER_API_KEY:    ${{ secrets.OPENROUTER_API_KEY }}
          F5_REF_AUDIO:          assets/voice_ref.wav
          F5_REF_TEXT:           ${{ secrets.F5_REF_TEXT }}
          PEXELS_API_KEY:        ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:       ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          echo "Execution mode: ${{ steps.test_window.outputs.mode }}"
          echo "Application source branch: ${{ steps.test_window.outputs.ref }}"

          INPUT_COUNT="${{ inputs.video_count }}"
          if [ -n "$INPUT_COUNT" ]; then
            N=$INPUT_COUNT
            echo "Manual override: $N video(s)."
          else
            N=$((RANDOM % 3))
            echo "Random draw: $N video(s) today."
          fi

          if [ "$N" -eq 0 ]; then
            echo "Zero videos chosen — skipping today."
            exit 0
          fi

          LANE="${{ inputs.lane }}"
          NO_UPLOAD="${{ inputs.no_upload || 'false' }}"
          SKIP_SVD="${{ inputs.skip_svd || 'false' }}"
          SKIP_SLEEP="${{ inputs.skip_random_sleep || 'false' }}"

          BASE="--random-batch --videos-min 1 --videos-max 1"
          [ -n "$LANE" ]              && BASE="$BASE --lane $LANE"
          [ "$NO_UPLOAD" = "true" ]  && BASE="$BASE --no-upload"
          [ "$SKIP_SVD"  = "true" ]  && BASE="$BASE --skip-svd"

          if [ "$SKIP_SLEEP" != "true" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            OFFSET=$((RANDOM % 1201))
            echo "Initial offset: ${OFFSET}s"
            sleep "$OFFSET"
          fi

          for i in $(seq 1 "$N"); do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  VIDEO $i / $N   $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            python -m pipeline.orchestrator $BASE

            if [ "$i" -lt "$N" ] && [ "$SKIP_SLEEP" != "true" ]; then
              GAP=$(( (RANDOM % 1201) + 1200 ))
              echo "Cooling down ${GAP}s (~$((GAP/60)) min) before video $((i+1))..."
              sleep "$GAP"
            fi
          done

          echo "✓ All $N video(s) done"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            runs/**/*.json
            runs/**/captions.srt
            runs/**/thumbnail.jpg
          retention-days: 14
          if-no-files-found: warn

      - name: Commit ledger + run summaries back to executed branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "utube-bot"
          git config user.email "utube-bot@users.noreply.github.com"
          git add ledger.json runs/**/*.json runs/**/captions.srt
          if ! git diff --cached --quiet; then
            git commit -m "chore(run): daily batch $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin "HEAD:${{ steps.test_window.outputs.ref }}"
          else
            echo "Nothing to commit."
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily run failed (${today})`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["daily-batch-failure"],
            });
