name: Manual Test (single video, no upload)

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Niche slot to build"
        required: true
        default: "tech_news"
        type: choice
        options:
          - did_you_know
          - tech_news
          - ai_breakthrough
          - cybersecurity
          - viral_science
      skip_svd:
        description: "Skip SVD animation (faster build)"
        required: false
        default: "true"
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build args
        id: args
        run: |
          ARGS="--slot ${{ inputs.slot }} --no-upload"
          if [ "${{ inputs.skip_svd }}" = "true" ]; then ARGS="$ARGS --skip-svd"; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run pipeline (no upload)
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          DRY_RUN: "1"
        run: |
          python -m pipeline.orchestrator ${{ steps.args.outputs.args }}

      - name: Upload built video + thumbnail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.slot }}-${{ github.run_id }}
          path: |
            runs/**/*.mp4
            runs/**/thumbnail.jpg
            runs/**/script.json
            runs/**/result.json
          retention-days: 7
          if-no-files-found: warn
