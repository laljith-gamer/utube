name: Thursday Weekly Analysis

# Scheduled from main, but during 2026-08-30 through 2026-09-05 the
# analysis code is explicitly checked out from `improved` for evaluation.

on:
  schedule:
    - cron: "30 23 * * 4"
  workflow_dispatch:

jobs:
  analyze_trends:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - name: Select code branch for one-week evaluation
        id: test_window
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"
          TEST_END="2026-09-05"
          if [[ "$TODAY" < "2026-08-30" ]]; then
            REF="main"
            MODE="normal-pre-test"
          elif [[ "$TODAY" > "$TEST_END" ]]; then
            REF="main"
            MODE="normal-post-test"
          else
            REF="improved"
            MODE="IMPROVED-WEEK-TEST"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "TEST DATE: $TODAY"
          echo "EXECUTION MODE: $MODE"
          echo "CODE REF: $REF"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ steps.test_window.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt
          uv pip install --system google-api-python-client google-auth-oauthlib google-auth-httplib2 requests

      - name: Run Trend Analysis
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          echo "Execution mode: ${{ steps.test_window.outputs.mode }}"
          echo "Application source branch: ${{ steps.test_window.outputs.ref }}"
          python scripts/analyze_trends.py

      - name: Commit Trend Updates back to executed branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "utube-bot"
          git config user.email "utube-bot@users.noreply.github.com"
          git add trend_report.md config/goal.yaml data/content_memory.json data/performance.json data/dynamic_strategy.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(analysis): update learning state $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin "HEAD:${{ steps.test_window.outputs.ref }}"
          else
            echo "Nothing to commit."
          fi
