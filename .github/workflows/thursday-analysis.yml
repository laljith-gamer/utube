name: Thursday Weekly Analysis

# Production weekly learning loop. Runs only from the default/production branch `main`.

on:
  schedule:
    - cron: "30 23 * * 4"
  workflow_dispatch:

jobs:
  analyze_trends:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt
          uv pip install --system google-api-python-client google-auth-oauthlib google-auth-httplib2 requests
      - name: Run Thursday Learning Loop
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          LLMSRELAY_API_KEY: ${{ secrets.LLMSRELAY_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/analyze_trends.py
      - name: Commit Trend Updates
        if: always()
        run: |
          set -euo pipefail
          git config user.name "utube-bot"
          git config user.email "utube-bot@users.noreply.github.com"
          git add trend_report.md config/goal.yaml data/content_memory.json data/performance.json data/dynamic_strategy.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(analysis): update learning state $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "Nothing to commit."
          fi
