# Per-stage tunables. Every "magic number" lives here, not in code.
# Edit any value and the next pipeline run picks it up — no code changes.

video:                              # final output specs
  width: 1080
  height: 1920
  fps: 30
  target_duration_sec: 35
  min_duration_sec: 28
  max_duration_sec: 45
  num_scenes: 7
  use_svd_for_n_scenes: 4

discover:
  user_agent: "utube-bot/1.0 (+https://github.com/laljith-gamer/utube)"
  total_candidates_limit: 25
  per_source_limits:
    hackernews: 15
    reddit_per_subreddit: 8
    rss: 8
    wikipedia_otd: 10
    github_trending: 10
    devto: 10
  request_timeout_sec: 20

research:
  source_text_max_chars: 6000
  topic_select:
    max_tokens: 2000
    temperature: 0.5
    reasoning_effort: null         # null = no reasoning (fast, cheap)
  brief:
    max_tokens: 2500
    temperature: 0.4
    reasoning_effort: null

script:
  max_tokens: 8000
  temperature: 0.8
  # "low" works well for a 35s narration: enough internal planning, plenty of
  # tokens left for the actual JSON output. "high" causes truncation where the
  # model spends the entire budget reasoning and never writes the answer.
  reasoning_effort: low
  words_per_second: 2.5            # 150 wpm narration pace
  hook_max_seconds: 3

audio:
  bitrate: "128k"
  codec: libmp3lame

captions:
  enabled: true
  whisper_model_size: base         # tiny | base | small | medium | large-v3
  whisper_device: cpu
  whisper_compute_type: int8
  beam_size: 1
  word_timestamps: true
  vad_filter: true
  words_per_chunk: 3               # how many words per caption cue

thumbnail:
  width: 1280
  height: 720
  jpeg_quality: 88
  text_height_ratio: 0.16
  text_y_ratio: 0.55
  text_line_spacing_ratio: 0.18
  margin_left: 40
  stroke_width: 3
  darken_overlay_alpha: 140        # 0-255, bottom-half darkening for legibility
  font_paths:
    - /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
    - /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf
    - /Library/Fonts/Arial Bold.ttf

assemble:
  ken_burns:
    zoom_increment_per_frame: 0.0015
    max_zoom: 1.4
  music:
    volume: 0.18                   # bg music level (1.0 = original)
    loop: true
  ffmpeg:
    video_codec: libx264
    audio_codec: aac
    crf: 20
    preset: medium
    audio_bitrate: 128k
    pix_fmt: yuv420p
    movflags: "+faststart"
  caption_subtitle_style:
    fontname: "DejaVu Sans"
    bold: 1
    fontsize_divisor: 3            # final fontsize = caption_style.fontsize / divisor (libass)
    primary_color_hex: "00FFFFFF"  # AABBGGRR for ASS
    outline_color_hex: "00000000"
    alignment: 2                   # 2 = bottom center
    margin_v: 120

stage_timeouts_sec:
  discover: 60
  research: 90
  script: 120
  tts: 180
  visuals: 600
  captions: 120
  thumbnail: 90
  assemble: 240
  upload: 300
