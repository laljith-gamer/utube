# Per-stage tunables. Every "magic number" lives here, not in code.
# Edit any value and the next pipeline run picks it up — no code changes.

video:                              # final output specs
  width: 1080
  height: 1920
  fps: 30
  target_duration_sec: 35
  min_duration_sec: 28
  max_duration_sec: 45
  num_scenes: 7
  use_svd_for_n_scenes: 4

# Pacing controls — drive the "MrBeast feel": fast cuts, snappy delivery,
# no dead air. Scenes shorter than scene_min_sec are auto-padded by the LLM
# (it's told the minimum); scenes longer than scene_max_sec are flagged.
pacing:
  scene_min_seconds: 2.5
  scene_max_seconds: 5.5
  default_voice_rate: "+15%"
  default_voice_pitch: "+0Hz"
  trim_silence: true
  silence_threshold_db: -45
  silence_min_duration_sec: 0.15
  master_tempo_multiplier: 1.0
  scene_transition: hard_cut
  crossfade_duration_sec: 0.15

# Visuals routing — drives "real motion video, not a slideshow".
visuals:
  prefer_stock_video: true
  enable_svd: false
  motion_scenes_default: 5
  stock_min_match_score: 0

# Per-scene text overlays for big-number callouts.
overlay:
  enabled: true
  fontname: "DejaVu Sans"
  fontsize: 130
  fontcolor: "white"
  bordercolor: "black"
  borderw: 6
  shadow_x: 4
  shadow_y: 4
  position: top
  margin_v_ratio: 0.18
  fade_in_sec: 0.20
  fade_out_sec: 0.25
  enter_zoom_factor: 1.10

# Outro card — the last 2-3 seconds, "Follow for more" headline.
outro:
  enabled: true
  duration_sec: 2.5
  text_main: "FOLLOW FOR MORE"
  text_sub: "Daily tech that breaks your brain."
  fontname: "DejaVu Sans"
  fontsize_main: 110
  fontsize_sub: 46
  fontcolor: "white"
  background_dim_alpha: 0.55
  borderw_main: 7
  borderw_sub: 3

discover:
  user_agent: "utube-bot/1.0 (+https://github.com/laljith-gamer/utube)"
  total_candidates_limit: 30
  per_source_limits:
    hackernews: 15
    reddit_per_subreddit: 6
    rss: 10
    wikipedia_otd: 10
    github_trending: 10
    devto: 10
  request_timeout_sec: 20

research:
  source_text_max_chars: 6000
  topic_select:
    max_tokens: 2000
    temperature: 0.5
    reasoning_effort: null
  brief:
    max_tokens: 2500
    temperature: 0.4
    reasoning_effort: null

script:
  max_tokens: 8000
  temperature: 0.85
  reasoning_effort: low
  words_per_second: 2.5
  hook_max_seconds: 3
  narration_sentence_words_min: 6
  narration_sentence_words_max: 12

audio:
  bitrate: "128k"
  codec: libmp3lame

# Captions — "TikTok-style" karaoke captions: dead-center, fade in/out,
# active word highlights in a different colour and pulses slightly larger.
captions:
  enabled: true
  whisper_model_size: base          # tiny | base | small | medium | large-v3
  whisper_device: cpu
  whisper_compute_type: int8
  beam_size: 1
  word_timestamps: true
  vad_filter: true
  words_per_chunk: 2                # words shown together per cue line
                                    # (2 fits comfortably at fontsize 38;
                                    # bump to 3-4 if you reduce font size)
  format: ass                       # ass | srt — ass enables karaoke + fade
  fade_in_ms: 150                   # line invisible -> visible
  fade_out_ms: 250                  # line visible -> invisible
  highlight_active_word: true       # use \K karaoke colour highlight per word
  active_word_scale_pct: 115        # size pulse % during the word's spoken time
                                    # (100 = no pulse, 130 = bouncy)
  size_pulse_up_ratio: 0.30         # fraction of word duration to scale UP
                                    # (rest of the time scales back to 100)

# Thumbnail — 9:16 to match the Shorts vertical format
thumbnail:
  width: 720                        # 9:16 vertical (was 1280)
  height: 1280                      # 9:16 vertical (was 720)
  jpeg_quality: 90
  text_height_ratio: 0.13           # smaller relative because canvas is taller
  text_y_ratio: 0.42
  text_line_spacing_ratio: 0.16
  margin_left: 60
  stroke_width: 5
  darken_overlay_alpha: 170
  font_paths:
    - /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
    - /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf
    - /Library/Fonts/Arial Bold.ttf

assemble:
  ken_burns:
    zoom_increment_per_frame: 0.0028
    max_zoom: 1.55
    pan_x_amplitude: 0.10
    pan_y_amplitude: 0.06
  music:
    volume: 0.20
    loop: true
  ffmpeg:
    video_codec: libx264
    audio_codec: aac
    crf: 20
    preset: medium
    audio_bitrate: 128k
    pix_fmt: yuv420p
    movflags: "+faststart"
  caption_subtitle_style:
    fontname: "DejaVu Sans"
    bold: 1
    fontsize: 38                    # was 32 — slightly bigger again
    primary_color_hex: "00FFFFFF"   # white  (ASS colour notation: AABBGGRR)
    highlight_color_hex: "0000FFFF" # yellow (active word)
    outline_color_hex: "00000000"
    back_color_hex: "A0000000"
    outline_width: 4
    shadow_depth: 1
    alignment: 5                    # 5 = MIDDLE-CENTER
    margin_v: 0                     # ignored when alignment is middle
    margin_h: 80                    # was 60 — wider side margin so words fit
    border_style: 1
    wrap_style: 0                   # 0=smart even-length, 1=EOL, 2=none, 3=lower-wider

stage_timeouts_sec:
  discover: 60
  research: 90
  script: 120
  tts: 180
  visuals: 600
  captions: 120
  thumbnail: 90
  assemble: 240
  upload: 300
