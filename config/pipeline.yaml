# Per-stage tunables. Every "magic number" lives here, not in code.
# Edit any value and the next pipeline run picks it up — no code changes.

video:                              # final output specs
  width: 1080
  height: 1920
  fps: 30
  target_duration_sec: 32
  min_duration_sec: 25              # tightened: dense pro-paced shorts can land at 25-42s
  max_duration_sec: 42

# Visuals: every scene is motion-based.
# Order: SDXL still -> SVD animation -> stock B-roll -> animated-gradient filler.
# There is NO static-image / Ken Burns slideshow path.
visuals:
  skip_svd: true                    # NIM SVD/SDXL endpoints are 404 — skip to save ~8 min per video

discover:
  user_agent: "script:utube-automation:v1.0 (by /u/laljith-gamer)"
  total_candidates_limit: 40        # raised — scoring engine needs a wider pool
  per_source_limits:
    hackernews: 15
    reddit_per_subreddit: 8
    rss: 8
    wikipedia_otd: 10
    github_trending: 10
    devto: 10
  request_timeout_sec: 20

research:
  source_text_max_chars: 6000
  brief:
    max_tokens: 3000
    temperature: 0.4
    reasoning_effort: null

script:
  max_tokens: 12000                 # raised from 8000: prevents mid-JSON truncation
  temperature: 0.7
  reasoning_effort: low
  words_per_second: 2.5
  hook_max_seconds: 1.5             # tightened from 2 — Shorts need sub-2s hooks
  min_scenes: 5                     # story-rhythm range instead of fixed count
  max_scenes: 8

audio:
  bitrate: "128k"
  codec: libmp3lame

captions:
  enabled: true
  whisper_model_size: base         # tiny | base | small | medium | large-v3
  whisper_device: cpu
  whisper_compute_type: int8
  beam_size: 1
  word_timestamps: true
  vad_filter: true
  words_per_chunk: 4               # 3-4 words per screen
  max_chars_per_line: 18           # lower this to force words onto a second line
  fade_ms: 150                     # cinematic fade in/out + float-up entrance (ms)

thumbnail:
  width: 1080
  height: 1920
  jpeg_quality: 92
  prompt_suffix: "vertical 9:16 YouTube Shorts thumbnail, cinematic close-up, high contrast, dramatic lighting, sharp subject, clean negative space for bold title text, premium viral thumbnail composition, no text, no watermark"
  enhance_contrast: 1.12
  enhance_color: 1.08
  enhance_sharpness: 1.15
  text_height_ratio: 0.135
  text_min_height_ratio: 0.07
  text_y_ratio: 0.66
  text_line_spacing_ratio: 0.08
  text_max_width_ratio: 0.86
  text_max_lines: 3
  text_align: center
  margin_left: 72
  stroke_width: 5
  darken_overlay_alpha: 165        # 0-255, lower-half darkening for portrait readability
  top_overlay_alpha: 60
  vignette_alpha: 110
  accent_bar_height_ratio: 0.012
  text_panel_alpha: 145
  text_panel_padding_ratio: 0.028
  text_panel_radius_ratio: 0.028
  text_shadow_offset_ratio: 0.006
  badge_text: ""
  badge_height_ratio: 0.042
  font_paths:
    - /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
    - /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf
    - /Library/Fonts/Arial Bold.ttf

assemble:
  motion_filler:                     # used only when SVD AND stock both fail for a scene
    speed: 0.02
    colors: ["0x0a0a2a", "0x4f1eb1", "0x111122", "0x222244"]
  image_motion:                      # applied to generated still images (Ken Burns style)
    zoom_rate: 0.0015                # zoom per frame (subtle)
    pan_speed: 2                     # pixels per frame
    duration_sec: 4                  # how long each image-motion clip lasts
  music:
    volume: 0.18                   # bg music level (1.0 = original)
    loop: true
  ffmpeg:
    video_codec: libx264
    audio_codec: aac
    crf: 20
    preset: medium
    audio_bitrate: 128k
    pix_fmt: yuv420p
    movflags: "+faststart"
  cinematic_caption_style:           # ASS-native style embedded in the .ass file
    fontname: "DejaVu Sans"          # CI-compatible; locally try "Arial" or "Segoe UI"
    fontsize: 72                     # ~3.75% of 1920px height — large, readable on phones
    bold: -1                         # -1 = true in ASS
    primary_color: "&H00FFFFFF"      # White base text (AABBGGRR)
    secondary_color: "&H000000FF"    # Red (karaoke fill, unused)
    outline_color: "&H00000000"      # Pure black outline
    back_color: "&H80000000"         # Semi-transparent black shadow
    outline: 3.5                     # Strong but soft outline for readability over any background
    shadow: 1.5                      # Subtle drop shadow for depth
    spacing: 1.5                     # Slight letter spacing — clean, premium feel
    alignment: 5                     # 5 = center-center (dead center of screen)
    margin_l: 130                    # ~12% of 1080px → wrapping width ≈ 76% of video
    margin_r: 130
    margin_v: 0                      # Not used when \pos/\move override positioning
    border_style: 1                  # 1 = outline + drop shadow (not opaque box)
    float_pixels: 6                  # Subtle float-up entrance: 6px glide on fade-in

stage_timeouts_sec:
  discover: 60
  topic_scoring: 90
  concept: 60
  research: 90
  script: 120
  script_qc: 90
  tts: 180
  visuals: 600
  visual_qc: 30
  captions: 120
  thumbnail: 90
  assemble: 240
  upload: 300
