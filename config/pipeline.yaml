# Per-stage tunables. Every "magic number" lives here, not in code.
# Edit any value and the next pipeline run picks it up — no code changes.

video:                              # final output specs
  width: 1080
  height: 1920
  fps: 30
  target_duration_sec: 35
  min_duration_sec: 28
  max_duration_sec: 45
  num_scenes: 7
  use_svd_for_n_scenes: 4

# Pacing controls — drive the "MrBeast feel": fast cuts, snappy delivery,
# no dead air. Scenes shorter than scene_min_sec are auto-padded by the LLM
# (it's told the minimum); scenes longer than scene_max_sec are flagged.
pacing:
  scene_min_seconds: 2.5
  scene_max_seconds: 5.5
  default_voice_rate: "+15%"        # used if a slot doesn't override
  default_voice_pitch: "+0Hz"
  trim_silence: true
  silence_threshold_db: -45
  silence_min_duration_sec: 0.15
  master_tempo_multiplier: 1.0
  scene_transition: hard_cut        # hard_cut | crossfade
  crossfade_duration_sec: 0.15

# Visuals routing — drives "real motion video, not a slideshow":
# When a scene has a key_subject AND prefer_stock_video is true, we search
# Pexels/Pixabay first for real footage that matches the narration. Only
# when stock has no match do we fall back to AI image generation + Ken Burns.
visuals:
  prefer_stock_video: true          # try stock B-roll BEFORE SDXL when key_subject exists
  enable_svd: false                 # SVD animates SDXL stills; off by default (slow + credits)
  motion_scenes_default: 5          # if LLM doesn't flag use_motion, mark first N as motion
  stock_min_match_score: 0          # 0=accept first match (Pexels has no score field)

# Per-scene text overlays — the way a human editor would slap a big "$1B"
# on screen when the narrator says "one billion". The LLM emits an optional
# text_overlay string per scene; if present, we burn it on with FFmpeg drawtext.
overlay:
  enabled: true
  fontname: "DejaVu Sans"
  fontsize: 130                     # very large; this is for short punchy text only
  fontcolor: "white"
  bordercolor: "black"
  borderw: 6
  shadow_x: 4
  shadow_y: 4
  position: top                     # top | center | bottom
  margin_v_ratio: 0.18              # distance from top/bottom as fraction of height
  fade_in_sec: 0.20
  fade_out_sec: 0.25
  enter_zoom_factor: 1.10           # subtle pop-in scale animation

# Outro card — the last 2-3 seconds where a real YouTuber says
# "Follow / subscribe for more". Generated with FFmpeg + drawtext on the
# last frame darkened to ~50%; no extra assets needed.
outro:
  enabled: true
  duration_sec: 2.5
  text_main: "FOLLOW FOR MORE"
  text_sub: "Daily tech that breaks your brain."
  fontname: "DejaVu Sans"
  fontsize_main: 110
  fontsize_sub: 46
  fontcolor: "white"
  background_dim_alpha: 0.55        # 0..1, how much we darken the freeze-frame
  borderw_main: 7
  borderw_sub: 3

discover:
  user_agent: "utube-bot/1.0 (+https://github.com/laljith-gamer/utube)"
  total_candidates_limit: 30
  per_source_limits:
    hackernews: 15
    reddit_per_subreddit: 6
    rss: 10
    wikipedia_otd: 10
    github_trending: 10
    devto: 10
  request_timeout_sec: 20

research:
  source_text_max_chars: 6000
  topic_select:
    max_tokens: 2000
    temperature: 0.5
    reasoning_effort: null
  brief:
    max_tokens: 2500
    temperature: 0.4
    reasoning_effort: null

script:
  max_tokens: 8000
  temperature: 0.85
  reasoning_effort: low
  words_per_second: 2.5
  hook_max_seconds: 3
  narration_sentence_words_min: 6
  narration_sentence_words_max: 12

audio:
  bitrate: "128k"
  codec: libmp3lame

captions:
  enabled: true
  whisper_model_size: base
  whisper_device: cpu
  whisper_compute_type: int8
  beam_size: 1
  word_timestamps: true
  vad_filter: true
  words_per_chunk: 3                # back to 3 (was 2) — easier to read

thumbnail:
  width: 1280
  height: 720
  jpeg_quality: 90
  text_height_ratio: 0.18
  text_y_ratio: 0.50
  text_line_spacing_ratio: 0.20
  margin_left: 50
  stroke_width: 5
  darken_overlay_alpha: 170
  font_paths:
    - /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
    - /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf
    - /Library/Fonts/Arial Bold.ttf

assemble:
  ken_burns:
    zoom_increment_per_frame: 0.0028
    max_zoom: 1.55
    pan_x_amplitude: 0.10
    pan_y_amplitude: 0.06
  music:
    volume: 0.20
    loop: true
  ffmpeg:
    video_codec: libx264
    audio_codec: aac
    crf: 20
    preset: medium
    audio_bitrate: 128k
    pix_fmt: yuv420p
    movflags: "+faststart"
  caption_subtitle_style:
    fontname: "DejaVu Sans"
    bold: 1
    fontsize: 22                    # smaller (was 36) — non-intrusive
    primary_color_hex: "00FFFFFF"
    outline_color_hex: "00000000"
    back_color_hex: "A0000000"
    outline_width: 3                # thinner (was 5)
    shadow_depth: 1
    alignment: 2                    # 2 = bottom center
    margin_v: 280                   # higher off bottom (was 200) — more breathing room
    border_style: 1

stage_timeouts_sec:
  discover: 60
  research: 90
  script: 120
  tts: 180
  visuals: 600
  captions: 120
  thumbnail: 90
  assemble: 240
  upload: 300
