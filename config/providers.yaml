image:
  chain:
  - pollinations
  default_negative_prompt: low quality, blurry, watermark, text, signature, deformed,
    extra limbs
  request_timeout_sec: 120
  providers:
    pollinations:
      url_template: https://image.pollinations.ai/prompt/{prompt}?width={w}&height={h}&nologo=true&enhance=true
      min_response_bytes: 1000
video:
  chain: []
  request_timeout_sec: 300
  providers: {}
tts:
  chain:
  - mistral
  default_rate: +0%
  default_pitch: +0Hz
  continuous_narration: true
  normalize_output: true
  trim_silence: true
  silence_threshold_db: -45
  silence_keep_sec: 0.4
  request_timeout_sec: 1800
  providers:
    mistral:
      backend: mistral_tts
      url: https://api.mistral.ai/v1/audio/speech
      api_key_env: MISTRAL_API_KEY
      params:
        model: voxtral-mini-tts-2603
        default_voice: gb_oliver_neutral
    f5tts:
      params:
        model: F5TTS_v1_Base
        device: cpu
        speed: 0.85
    camb:
      backend: camb_tts
      url: https://client.camb.ai/apis/tts-stream
      api_key_env: CAMB_API_KEY
      params:
        language: en-us
        voice_id: 147320
        speech_model: mars-instruct
        user_instructions: Speak like a calm friend explaining something fascinating.
          Keep the delivery ultra-natural, continuous, clear, subtly expressive, brisk
          but comfortable, and never robotic, theatrical, dramatic, or like a news
          anchor. Preserve the supplied text exactly; do not rewrite, summarize, add,
          remove, repeat, or skip any words. Use natural emphasis on important words,
          slight pacing variation for hooks, facts, reveals, and endings, and only
          tiny human-like pauses where they feel natural.
        enhance_named_entities_pronunciation: true
        output_configuration:
          format: wav
          apply_enhancement: true
        voice_settings:
          enhance_reference_audio_quality: false
          maintain_source_accent: false
          speaking_rate: 1.08
        inference_options:
          inference_steps: 60
    edge:
      backend: edge_tts
    gtts:
      backend: gtts
      params:
        slow: false
    nim_magpie:
      url: https://ai.api.nvidia.com/v1/genai/nvidia/magpie-tts-multilingual
      api_key_env: NVIDIA_NIM_API_KEY
      params:
        encoding: mp3
        sample_rate_hz: 22050
        default_voice: Magpie-Multilingual.EN-US.Ray
stock:
  chain:
  - pexels
  - pixabay
  request_timeout_sec: 120
  providers:
    pexels:
      url: https://api.pexels.com/videos/search
      api_key_env: PEXELS_API_KEY
      per_page: 5
      size: medium
    pixabay:
      url: https://pixabay.com/api/videos/
      api_key_env: PIXABAY_API_KEY
      per_page: 5
      safesearch: true
youtube:
  category_id: '28'
  upload_chunk_size_mb: 8
  scopes:
  - https://www.googleapis.com/auth/youtube.upload
  default_made_for_kids: false
  token_uri: https://oauth2.googleapis.com/token
  client_id_env: YOUTUBE_CLIENT_ID
  client_secret_env: YOUTUBE_CLIENT_SECRET
  refresh_token_env: YOUTUBE_REFRESH_TOKEN
  title_max_chars: 100
  description_max_chars: 5000
  tags_max: 30

