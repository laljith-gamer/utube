llm_research:
  chain:
  - nvidia_nim_primary
  request_timeout_sec: 300
  reasoning_token_floor:
    low: 3000
    medium: 8000
    high: 16000
  retry_on_rate_limit_seconds: 10
  providers:
    nvidia_nim_primary:
      request_timeout_sec: 7200
      base_url: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_NIM_API_KEY
      model: deepseek-ai/deepseek-v4-pro-0813
      supports_reasoning_effort: false
      params:
        temperature: 0.4
        top_p: 0.95
        max_tokens: 6000
    nvidia_nim_fallback:
      request_timeout_sec: 7200
      base_url: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_NIM_API_KEY
      model: deepseek-ai/deepseek-v4-pro-0813
      supports_reasoning_effort: false
      params:
        temperature: 0.4
        top_p: 0.95
        max_tokens: 6000
    openrouter_research:
      max_retries: 8
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      model: meta-llama/llama-3.3-70b-instruct
      supports_reasoning_effort: false
      params:
        temperature: 0.4
        top_p: 0.95
        max_tokens: 4000
