# Daily run schedule (workflow runs once a day, produces all slots in parallel,
# uploads each with the slot's individual schedule_utc as publishAt).

cron_utc: "0 0 * * *"
publish_strategy: scheduled            # "scheduled" → uses publishAt; "immediate" → public on upload
privacy_status_for_scheduled: private  # required by YouTube when using publishAt
dedup_days: 30                         # don't pick a topic whose hash matches one used in the last N days
